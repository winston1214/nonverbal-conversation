base_model: Qwen/Qwen2.5-3B-Instruct
# base_model: meta-llama/Llama-3.2-3B-Instruct
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

# Axolotl Setting
# adapter: null  # full fine-tuning
trust_remote_code: true
flash_attention: true
sample_packing: true

# FSDP (8 GPU)
fsdp:
  - "full_shard"
  - "auto_wrap"
fsdp_config:
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_transformer_layer_cls_to_wrap: Qwen2DecoderLayer
  limit_all_gathers: true
  forward_prefetch: true
  backward_prefetch: "BACKWARD_POST"
  activation_checkpointing: true

# Tokenizer
tokenizer_config: ./custom_tokenizer_qwen2_5_3b
model_max_length: 4096
# tokenizer_config:
#   tokenizer_path: "custom_tokenizer"
#   padding_side: "right"
#   truncation_side: "right"
#   model_max_length: 1024

# Dataset Setting
datasets:
  - path: data/small_train.jsonl
    type: chat_template

    field_messages: messages         
    message_property_mappings:
      role: role 
      content: content  

# 학습 설정
sequence_len: 4096
pad_to_sequence_len: true

micro_batch_size: 4  # per GPU batch size
gradient_accumulation_steps: 1
num_epochs: 25
max_steps: -1  

# optimizer
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 1e-5
max_grad_norm: 1.0
weight_decay: 0.0

# training stability
bf16: true
fp16: false
tf32: true
gradient_checkpointing: false
train_on_inputs: false
group_by_length: true

# Save and logging
save_steps: 1000
# eval_steps: 50
logging_steps: 100
save_total_limit: 3
# val_set_size: 0.05

# output
output_dir: ./small_ckpt_qwen2_5_3b_seq4096
dataset_prepared_path: last_run_prepared
hub_model_id: null
hub_private_repo: false
push_to_hub: false